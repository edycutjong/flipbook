version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types: [patch]
    ignore:
      # The dependency set is pinned to what the Vega toolchain builds against (React 19.2 / RN 0.83 and the
      # sample's test stack); majors and minors move with the SDK, not alone. Patch releases and security
      # updates still arrive.
      - dependency-name: '*'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
