version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      amazon-devices:
        patterns: ['@amazon-devices/*']
      react-native:
        patterns: ['react-native', '@react-native/*', 'react', 'react-test-renderer']
    ignore:
      # These are pinned to what the Vega toolchain builds against; bump them with the SDK, not alone.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: '@react-native/*'
      - dependency-name: '@amazon-devices/*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
