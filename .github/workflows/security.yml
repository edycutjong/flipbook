name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  audit:
    name: Dependency audit (npm audit, production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Report-only: the critical advisories today are all in the Amazon Vega sample's React Native CLI chain
      # (react-native -> @react-native-community/cli -> logkitty/shell-quote, dev tooling) and its xmldom
      # dependency, none reachable from Flipbook's code. The summary is kept so they stay visible; fix by bumping
      # the sample's pinned versions with the Vega SDK.
      - name: npm audit (production)
        continue-on-error: true
        run: |
          npm audit --omit=dev --package-lock-only | tee audit.txt
          { echo '### npm audit (production deps)'; echo '```'; tail -n 12 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
