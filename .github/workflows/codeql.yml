name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - src/w3cmedia/shakaplayer/dist
              - shaka-setup
              - coverage
      # Code scanning upload needs GitHub Advanced Security on private repos. While the repo is private the
      # analysis still runs and the SARIF is kept as an artifact; once the repo is public it uploads normally.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
          output: sarif-results
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - name: Keep SARIF while the repo is private
        if: github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
