name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck · lint · Jest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts skips the sample's Shaka Player postinstall build (needs a full Shaka toolchain);
      # the Jest suite does not load the compiled Shaka bundle.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - name: Jest
        run: npx jest --coverage
      - name: Detector reproduces the committed results offline
        run: npm run verify:offline
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
