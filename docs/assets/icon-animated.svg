<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Flipbook — scans a match’s trickplay thumbnails; on the frame where the score graphic changes, a red tick lands on the seek bar. No feed, no video decode.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: plate, a strip of three frames, an unread grey seek bar — the before-state (poster: complete, nothing half-drawn)
  10-38%  trigger:      the amber scan rule sweeps the frames left to right and the bar fills amber as each frame is read      data-story="beat-2"
  30-55%  mechanism:    Six grease-pencil ticks land on the seek bar; the app has never seen a feed, a schedule, or decoded video.   (icon shows one of them: frame 3's score box changes, the keeper loop draws, the tick drops)   data-story="beat-3"
  55-80%  resolution:   the tick holds on the bar — the change stayed changed; a slow glow breath on the mark      data-story="beat-4"
  80-100% breathe + seam fade: story layer fades .96-.985; frame 0 and frame end are the same picture
-->
